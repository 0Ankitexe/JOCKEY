[workspace]
members = [
    "codegen",
    "forensic-lib",
    "ir",
    "language",
    "runtime",
    "shared",
    "transforms",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
jsonschema = { version = "0.33", default-features = false }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

